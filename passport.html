<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Passport Photo</title>
<style>
html,body{margin:0;width:100%;height:100%;background:#eff5fb;overflow:hidden}body{display:grid;place-items:center}img{display:block;width:100%;height:100%;object-fit:cover} 
</style></head>
<body><img id="passportImage" src="assets/passport-placeholder.svg" alt="Passport photograph placeholder">
<script>
window.addEventListener('message',function(event){
  if(event.source!==window.parent || !event.data || event.data.type!=='passport-photo')return;
  if(typeof event.data.url==='string' && event.data.url.startsWith('data:image/')){
    document.getElementById('passportImage').src=event.data.url;
  }
});
</script></body></html>
